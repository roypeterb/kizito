<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join the team | St. Kizito Namugongo Cyber Team</title>
<meta name="description" content="Apply to join the St. Kizito Namugongo Cyber and Robotics Team.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="site.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="join" class="min-h-screen flex flex-col bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
<main id="main" class="flex-grow">
<section class="max-w-xl mx-auto px-4 py-16 space-y-8">
<div class="space-y-2"><h1 class="text-3xl font-extrabold tracking-tight">Join the Cyber and Robotics Team</h1>
<p class="text-slate-600 dark:text-slate-300">Open to all students of St. Kizito High School Namugongo.</p></div>
<form id="join-form" class="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 space-y-5">
<div><label for="n" class="block text-sm font-semibold mb-1.5">Full name</label><input id="n" required placeholder="John Kato" class="w-full px-4 py-2.5 rounded-md border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm"></div>
<div><label for="c" class="block text-sm font-semibold mb-1.5">Class and stream</label><input id="c" required placeholder="Senior 5 PCM/ICT" class="w-full px-4 py-2.5 rounded-md border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm"></div>
<button class="w-full py-3 rounded-md bg-brand text-white font-semibold hover:bg-brand-600">Send application</button>
<p id="join-msg" role="status" class="text-sm font-medium text-emerald-600"></p>
</form></section>
<script>
// TODO: connect this form to a backend or form service (for example Formspree or Google Forms).
document.getElementById('join-form').addEventListener('submit',e=>{e.preventDefault();e.target.reset();document.getElementById('join-msg').textContent='Application received. A team patron will contact you.';});
</script>
</main>
</body>
</html>
