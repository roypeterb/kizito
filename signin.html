<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in | St. Kizito Namugongo Cyber Team</title>
<meta name="description" content="Sign in to the Cyber Team portal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="site.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="signin" class="min-h-screen flex flex-col bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
<main id="main" class="flex-grow">
<section class="max-w-md mx-auto px-4 py-20">
<form id="si" class="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 space-y-5">
<div class="space-y-1"><h1 class="text-2xl font-bold">Portal sign in</h1><p class="text-sm text-slate-500">Access student logs and the team dashboard.</p></div>
<div><label for="u" class="block text-sm font-semibold mb-1.5">Student or patron ID</label><input id="u" required placeholder="SKHS-2026-001" class="w-full px-4 py-2.5 rounded-md border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm"></div>
<div><label for="p" class="block text-sm font-semibold mb-1.5">Password</label><input id="p" type="password" required class="w-full px-4 py-2.5 rounded-md border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm"></div>
<button class="w-full py-3 rounded-md bg-brand text-white font-semibold hover:bg-brand-600">Sign in</button>
</form></section>
<script>
// DEMO ONLY: this accepts any credentials. Replace with real server-side authentication.
document.getElementById('si').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('skhs_auth','true');location.href='dashboard.html';});
</script>
</main>
</body>
</html>
