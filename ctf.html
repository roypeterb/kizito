<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTF Arena | St. Kizito Namugongo Cyber Team</title>
<meta name="description" content="Capture the flag challenges from the St. Kizito Namugongo Cyber Team.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="site.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="ctf" class="min-h-screen flex flex-col bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased">
<main id="main" class="flex-grow">
<section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-10">
<div class="max-w-2xl space-y-3"><h1 class="text-4xl font-extrabold tracking-tight">Capture the flag</h1>
<p class="text-slate-600 dark:text-slate-300">Practise ethical hacking and cryptography. Submit a flag to earn points.</p></div>
<div class="grid gap-8 lg:grid-cols-3">
<div class="lg:col-span-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 space-y-4">
<h2 class="font-bold">Challenge 1: the hidden admin hash</h2>
<p class="text-sm text-slate-600 dark:text-slate-400">Find the hidden admin hash in the school's robotics firmware simulator.</p>
<form id="flag-form" class="flex flex-col sm:flex-row gap-3">
<label for="flag-input" class="sr-only">Flag</label>
<input id="flag-input" type="text" required autocomplete="off" placeholder="SKHS{flag_here}" class="flex-grow px-4 py-2.5 rounded-md border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm font-mono">
<button class="px-6 py-2.5 rounded-md bg-brand text-white text-sm font-semibold hover:bg-brand-600">Submit flag</button></form>
<p id="flag-result" role="status" class="text-sm font-medium min-h-5"></p></div>
<aside class="rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6"><h2 class="font-bold">Scoreboard</h2><p class="text-xs text-slate-500">Sample data</p>
<ol class="mt-4 text-sm"><li class="flex justify-between py-2 border-t border-slate-100 dark:border-slate-800"><span>1. CyberKnight_01</span><span class="font-semibold">1,450 pts</span></li></ol></aside>
</div></section>
<script>
// The flag is stored as a SHA-256 hash so it is not readable in the page source.
const FLAG_HASH='9ba5243a0d22f07f16b6d49759c878da56f4a2ccb7b2f357c4ca34378de72971';
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
document.getElementById('flag-form').addEventListener('submit',async e=>{e.preventDefault();
const r=document.getElementById('flag-result'),ok=await sha256(document.getElementById('flag-input').value.trim())===FLAG_HASH;
r.className='text-sm font-medium '+(ok?'text-emerald-600':'text-rose-600');
r.textContent=ok?'Correct. 250 points added.':'Incorrect flag. Try inspecting the microcontroller firmware.';});
</script>
</main>
</body>
</html>
